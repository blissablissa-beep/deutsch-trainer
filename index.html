<!doctype html>
<html lang="ja">
<head>

  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />

  <title>Deutsch Trainer (Private)</title>
  <style>
    :root {

      position: sticky; top: 0;

      backdrop-filter: blur(10px);
      border-bottom: 1px solid #222;
      z-index: 10;
    }

    .row { display:flex; align-items:center; justify-content:space-between; gap: 12px; }
    h1 { font-size: 18px; margin: 0; letter-spacing: .2px; }
    .btn {
      background:#1b1b1b; border:1px solid #2a2a2a; color:#fff;
      padding:8px 10px; border-radius:10px; font-size:14px;
    }

    .sub { color:#bdbdbd; font-size:13px; margin-top: 6px; }
    .tabs { display:flex; gap:8px; margin-top: 10px; }
    .tab { flex: 0 0 auto; }
    .btn.primary { border-color:#3a3a3a; background:#222; }
    .grid { display:grid; grid-template-columns: 1fr; gap: 12px; margin-top: 14px; }
    .card { background:#121212; border:1px solid #222; border-radius:14px; padding: 12px 12px; }
    .word { font-size:18px; font-weight:700; margin:0 0 6px; }
    .pill {
      display:inline-block; font-size:12px; padding:3px 8px;
      border:1px solid #2a2a2a; border-radius:999px; color:#cfcfcf; margin-right:6px;
    }
    .label { color:#9a9a9a; font-size:12px; margin-top:10px; }
    .txt { margin: 4px 0 0; white-space: pre-wrap; line-height: 1.5; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    .actions { display:flex; gap:8px; margin-top: 10px; flex-wrap: wrap; }
    .score { display:flex; gap:8px; margin-top: 10px; }
    .score .btn { flex: 1 1 0; padding: 10px 10px; }
    .muted { color:#8e8e8e; font-size:12px; }
    footer { margin-top: 18px; color:#8e8e8e; font-size:12px; }
    a { color:#9bd; }
    .count { color:#cfcfcf; font-size:13px; }
mark.hl {
  background: rgba(255, 215, 0, .22);
  color: inherit;
  padding: 0 .12em;
  border-radius: .25em;
}
    /* ===== Error box ===== */
    .error {
      background: #2a0f0f;
      border: 1px solid #5a1a1a;
      color: #ffd6d6;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 14px;
      font-size: 14px;
      line-height: 1.5;
    }
    .error.hidden { display: none; }
    .error .err-actions {
      margin-top: 10px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .error .err-btn {
      background: #1b1b1b;
      border: 1px solid #5a1a1a;
      color: #ffd6d6;
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 14px;
    }
    .error .err-btn:active { transform: translateY(1px); }
  </style>
</head>

<body>
<header>
  <div class="wrap">
    <div class="row">
      <div>
        <h1 id="appTitle">Deutsch Trainer</h1>
        <div class="sub" id="appSub">個人用 / PWA / JP⇄DE切替</div>
      </div>
      <button class="btn" id="langBtn" aria-label="toggle language">JP</button>

    <div class="tabs">
      <button class="btn tab primary" id="tabToday"></button>

<div class="row" style="margin-top:10px">
  <input
    id="q"
    class="btn"
    style="flex:1; text-align:left"

  <button class="btn" id="clearBtn">✕</button>
</div>
    <div class="row" style="margin-top:10px">
      <div class="sub" id="screenTitle"></div>

</header>

<main class="wrap">
  <!-- Error -->
  <div id="errorBox" class="error hidden"></div>

  <footer>
    <div class="muted">Tip: iPhone Safari → 共有 → <span class="mono">ホーム画面に追加</span></div>
  </footer>
</main>

<script>
  // =========================
  // Utilities
  // =========================
function isStr(x) { return typeof x === "string"; }
function nonEmptyStr(x) { return isStr(x) && x.trim().length > 0; }

function isTextBlock(x) {
  if (x === undefined || x === null) return true;
  if (isStr(x)) return true;
  if (Array.isArray(x)) return x.every(isStr);
  return false;
}

function isLangObj(x) {
  if (x === undefined || x === null) return true;
  if (typeof x !== "object" || Array.isArray(x)) return false;
  if ("ja" in x && !isTextBlock(x.ja)) return false;
  if ("de" in x && !isTextBlock(x.de)) return false;
  return true;
}

function validateCards(data) {
  const errors = [];

  if (!Array.isArray(data)) {
    return { ok: false, errors: ["cards.json is not an array"] };
  }

  const seen = new Map(); // id -> index(first)

  data.forEach((c, i) => {
    const prefix = `#${i + 1}`;

    if (!c || typeof c !== "object" || Array.isArray(c)) {
      errors.push(`${prefix}: card is not an object`);
      return;
    }

    if (!nonEmptyStr(c.id)) errors.push(`${prefix}: id is missing/empty`);
    if (!nonEmptyStr(c.word)) errors.push(`${prefix}: word is missing/empty`);

    if (nonEmptyStr(c.id)) {
      if (seen.has(c.id)) {
        const j = seen.get(c.id);
        errors.push(`${prefix}: duplicate id "${c.id}" (also at #${j + 1})`);
      } else {
        seen.set(c.id, i);
      }
    }

    if (c.tags !== undefined) {
      if (!Array.isArray(c.tags) || !c.tags.every(nonEmptyStr)) {
        errors.push(`${prefix} (${c.id || "no-id"}): tags must be string[]`);
      }
    }

    if (c.grammar !== undefined) {
      if (!c.grammar || typeof c.grammar !== "object" || Array.isArray(c.grammar)) {
        errors.push(`${prefix} (${c.id || "no-id"}): grammar must be an object`);
      } else if (c.grammar.pos !== undefined) {
        const okPos = ["noun", "verb", "adj", "adv"];
        if (!okPos.includes(c.grammar.pos)) {
          errors.push(`${prefix} (${c.id || "no-id"}): grammar.pos must be one of ${okPos.join(", ")}`);
        }
      }
    }

    const blocks = ["meaning", "nuance", "minimal", "etymology", "example", "task"];
    for (const k of blocks) {
      if (!isLangObj(c[k])) {
        errors.push(`${prefix} (${c.id || "no-id"}): ${k} must be {ja,de} with string or string[]`);
      }
    }
  });

  return { ok: errors.length === 0, errors };
}

  function normalizeText(v) {
    // string | array | undefined -> array of non-empty strings
    if (Array.isArray(v)) return v.map(x => (typeof x === "string" ? x.trim() : "")).filter(Boolean);
    if (typeof v === "string") {
      const s = v.trim();
      return s ? [s] : [];
    }
    return [];
  }

  function escapeHtml(s) {
    return String(s)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }
function escapeRegExp(s) {
  return String(s).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
}
function highlightIfNeeded(text) {
  const q = (QUERY || "").trim();
  if (q.length < 2) return escapeHtml(text);

  const re = new RegExp(escapeRegExp(q), "ig");

  // ① 一時マーカーを仕込む（開始・終了を分ける）
  let s = String(text).replace(
    re,
    m => `__HL_O__${m}__HL_C__`
  );

  // ② 全体を escape
  s = escapeHtml(s);

  // ③ マーカーを <mark> に戻す
  s = s
    .replaceAll("__HL_O__", '<mark class="hl">')
    .replaceAll("__HL_C__", "</mark>");

  return s;
}
  function renderTextBlock(label, lines, className = "txt") {
    if (!lines || lines.length === 0) return "";

    if (lines.length === 1) {
      return `
        <div class="label">${escapeHtml(label)}</div>
        <p class="${className}">${highlightIfNeeded(lines[0])}</p>
      `;
    }

    return `
      <div class="label">${escapeHtml(label)}</div>
      <ul class="${className}" style="margin:6px 0 0; padding-left: 18px; line-height:1.5;">
        ${lines.map(x => `<li>${highlightIfNeeded(x)}</li>`).join("")}
      </ul>
    `;
  }

  function renderPills(pills) {
    const ok = pills.map(x => (typeof x === "string" ? x.trim() : "")).filter(Boolean);
    if (!ok.length) return "";
    return ok.map(x => `<span class="pill">${escapeHtml(x)}</span>`).join("");
  }

  // =========================
  // Error overlay
  // =========================
  function showError(msg) {
    const box = document.getElementById("errorBox");
    if (!box) return;

    const htmlMsg = escapeHtml(msg).replaceAll("\n", "<br>");
    box.innerHTML = `
      <div>${htmlMsg}</div>
      <div class="err-actions">
        <button class="err-btn" id="reloadBtn">再読み込み</button>
      </div>
    `;
    box.classList.remove("hidden");

    const btn = document.getElementById("reloadBtn");
    if (btn) btn.onclick = () => location.reload();
  }

  function hideError() {
    const box = document.getElementById("errorBox");
    if (!box) return;
    box.classList.add("hidden");
    box.innerHTML = "";
  }

  // =========================
  // i18n (UI)
  // =========================
  const UI = {
    ja: {
      title: "Deutsch Trainer",
      sub: "個人用 / PWA / JP⇄DE切替",
      tabToday: "Today",
      tabReview: "Review",
      today: "今日の5語",
      searchResult: "検索結果",
      review: "復習（期限到来）",
      shuffle: "シャッフル",
      meaning: "意味（核心）",
      nuance: "語感・ニュアンス",
      minimal: "最小対立（近い語との違い）",
      etymology: "語源",
      example: "例文",
      task: "産出課題",
      due: "復習期限",
      score: "自己採点",
      good: "覚えた",
      ok: "微妙",
      bad: "ダメ",
      done: "記録しました",
      tags: { abs: "抽象", exam: "試験", coll: "コロケ" }
    },
    de: {
      title: "Deutsch Trainer",
      sub: "Privat / PWA / Umschalten JP⇄DE",
      tabToday: "Today",
      tabReview: "Review",
      searchResult: "Suchergebnis",
      today: "Heutige 5 Wörter",
      review: "Wiederholen (fällig)",
      shuffle: "Mischen",
      meaning: "Kernbedeutung",
      nuance: "Nuance / Gebrauch",
      minimal: "Minimalpaar (Abgrenzung)",
      etymology: "Etymologie",
      example: "Beispiel",
      task: "Output-Aufgabe",
      due: "Fällig am",
      score: "Selbsteinschätzung",
      good: "Gewusst",
      ok: "So lala",
      bad: "Falsch",
      done: "Gespeichert",
      tags: { abs: "abstrakt", exam: "Prüfung", coll: "Kollok." }
    }
  };

  function getLang() { return localStorage.getItem("dt_lang") || "ja"; }
  function setLang(lang) { localStorage.setItem("dt_lang", lang); }

  function getView() { return localStorage.getItem("dt_view") || "today"; }
  function setView(v) { localStorage.setItem("dt_view", v); }

  function t(key) {
    const lang = getLang();
    return UI[lang][key] ?? key;
  }

  function tagLabel(tag) {
    const lang = getLang();
    return UI[lang].tags[tag] || tag;
  }

  // =========================
  // Cards: load from JSON
  // =========================
  let CARDS = [];

  async function loadCards() {
    try {
      // ここを更新するだけで cards.json の更新が反映されやすい
      const CARDS_VERSION = "2026-01-06";

      const res = await fetch(`./cards.json?v=${encodeURIComponent(CARDS_VERSION)}`, {
        cache: "no-store"
      });

      if (!res.ok) throw new Error(`HTTP error ${res.status}`);

const data = await res.json();

const v = validateCards(data);
if (!v.ok) {
  CARDS = [];
  showError(
    "cards.json に問題があります:\n" +
    v.errors.map(e => "・" + e).join("\n")
  );
  return;
}
      CARDS = data;
      hideError();
    } catch (err) {
      console.error("cards.json の読み込みに失敗:", err);
      CARDS = [];
      showError(
        "単語データの読み込みに失敗しました。\n" +
        "・cards.json が存在するか\n" +
        "・JSON の文法エラーがないか\n" +
        "・GitHub Pages の反映待ち/キャッシュが残っていないか\n" +
        "を確認してください。"
      );
    }
  }
// =========================
// Search
// =========================
let QUERY = "";

function setQuery(v) {
  QUERY = (v || "").trim();
}

function toArr(v) {
  if (Array.isArray(v)) return v;
  if (typeof v === "string") return [v];
  return [];
}

function valuesFlat(obj) {
  return Object.values(obj || {}).flatMap(toArr);
}

function filterCardsByQuery(cards) {
  if (!QUERY) return cards;

  return cards.filter(c => {
    const hay = [
      c.word,
      c.level,
      c.freq,
      ...(c.tags || []),
      ...valuesFlat(c.meaning),
      ...valuesFlat(c.nuance),
      ...valuesFlat(c.minimal),
      ...valuesFlat(c.etymology),
      ...valuesFlat(c.example),
      ...valuesFlat(c.task),
    ]
      .filter(Boolean)
      .join(" ")
      .toLowerCase();

    return hay.includes(QUERY.toLowerCase());
  });
}
  // =========================
  // Seed shuffle (today)
  // =========================
  function todayKeyDate() {
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}${m}${day}`;
  }

  function getSeed() {
    let s = localStorage.getItem("dt_seed");
    if (!s) {
      s = Number(todayKeyDate());
      localStorage.setItem("dt_seed", String(s));
    }
    return Number(s);
  }

  function rotateSeed() {
    const s = Math.floor(Math.random() * 1e9);
    localStorage.setItem("dt_seed", String(s));
  }

  function seedShuffle(arr, seed) {
    let a = arr.slice();
    let x = seed;
    for (let i = a.length - 1; i > 0; i--) {
      x = (x * 1664525 + 1013904223) % 4294967296;
      const j = x % (i + 1);
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
// ===== SRS Reset (one-time) =====
// cards.json のID体系を変更したら、この値を変える
const SRS_SCHEMA_VERSION = "20260106";

(function resetSrsIfNeeded() {
  const k = "dt_srs_schema";
  const prev = localStorage.getItem(k);
  if (prev !== SRS_SCHEMA_VERSION) {
    localStorage.removeItem("dt_srs_state"); // 復習履歴リセット
    localStorage.setItem(k, SRS_SCHEMA_VERSION);
  }
})();
// NOTE:
// - cards.json の id 体系変更時
// - SRS データ構造変更時
// は SRS_SCHEMA_VERSION を更新すること
  // =========================
  // SRS
  // =========================
  const LS_SRS = "dt_srs_state";

  function startOfTodayMs() {
    const d = new Date();
    d.setHours(0, 0, 0, 0);
    return d.getTime();
  }

  function fmtDate(ms) {
    const d = new Date(ms);
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  }

  function loadSrs() {
    try { return JSON.parse(localStorage.getItem(LS_SRS) || "{}"); }
    catch { return {}; }
  }

  function saveSrs(state) {
    localStorage.setItem(LS_SRS, JSON.stringify(state));
  }

  function ensureCardState(state, id) {
    if (!state[id]) {
      state[id] = { intervalDays: 1, dueMs: startOfTodayMs() };
    }
    return state[id];
  }

  function applyScore(id, score) {
    const state = loadSrs();
    const s = ensureCardState(state, id);
    const today = startOfTodayMs();

    if (score === "good") {
      const next = Math.max(2, Math.round(s.intervalDays * 2.2));
      s.intervalDays = next;
      s.dueMs = today + next * 86400000;
    } else if (score === "ok") {
      const next = Math.max(1, Math.round(s.intervalDays * 1.3));
      s.intervalDays = next;
      s.dueMs = today + next * 86400000;
    } else {
      s.intervalDays = 1;
      s.dueMs = today;
    }

    state[id] = s;
    saveSrs(state);
  }

  function getDueCards() {
    const state = loadSrs();
    const today = startOfTodayMs();
    const due = [];
    for (const c of CARDS) {
      if (!c || !c.id) continue;
      const s = ensureCardState(state, c.id);
      if (s.dueMs <= today) due.push(c);
    }
    saveSrs(state);
    return due;
  }

  function getCardDueMs(id) {
    const state = loadSrs();
    const s = ensureCardState(state, id);
    saveSrs(state);
    return s.dueMs;
  }

  // =========================
  // Grammar / labels
  // =========================
  function formatPosLabel(pos) {
    if (!pos) return "";
    const map = { noun: "N", verb: "V", adj: "Adj", adv: "Adv" };
    return map[pos] || String(pos);
  }

function formatFreqLabel(freq) {
  const lang = getLang();

  const mapJa = { often: "頻出", sometimes: "たまに", rare: "稀" };
  const mapDe = { often: "häufig", sometimes: "gelegentlich", rare: "selten" };

  const map = (lang === "de") ? mapDe : mapJa;
  return map[freq] || String(freq || "");
}
  function formatGrammarLine(g) {
    if (!g || !g.pos) return "";
    const pos = g.pos;

    if (pos === "noun") {
const a = nonEmptyStr(g.article) ? g.article : "";
const pl = nonEmptyStr(g.plural)
  ? `Pl.: ${g.plural}`
  : (g.plural === "" ? "Pl.: —" : "");
      return [a, pl].filter(Boolean).join(" / ");
    }

    if (pos === "verb") {
const pr = nonEmptyStr(g.praeteritum) ? `Prät.: ${g.praeteritum}` : "";
const pf = nonEmptyStr(g.perfekt) ? `Perf.: ${g.perfekt}` : "";
return [pr, pf].filter(Boolean).join(" / ");
    }

    if (pos === "adj") return "Adj.";
    if (pos === "adv") return "Adv.";

    return String(pos);
  }

  // =========================
  // Render
  // =========================
  function renderCard(c, mode) {
    const lang = getLang();
    const dueMs = getCardDueMs(c.id);

    const g = c.grammar || {};
    const posLabel = formatPosLabel(g.pos);
    const grammarLine = formatGrammarLine(g);

    // Pills: pos + level + freq + tags
    const pillTexts = [];
    if (posLabel) pillTexts.push(posLabel);
if (nonEmptyStr(c.level)) pillTexts.push(c.level);
if (nonEmptyStr(c.freq)) pillTexts.push(formatFreqLabel(c.freq));
    if (Array.isArray(c.tags)) {
      for (const x of c.tags) pillTexts.push(tagLabel(x));
    }

    const meaningLines = normalizeText(c.meaning?.[lang]);
    const nuanceLines = normalizeText(c.nuance?.[lang]);
    const minimalLines = normalizeText(c.minimal?.[lang]);
    const etyLines = normalizeText(c.etymology?.[lang]);
    const exampleLines = normalizeText(c.example?.[lang]);
    const taskLines = normalizeText(c.task?.[lang]);

    const el = document.createElement("section");
    el.className = "card";
    el.innerHTML = `
      <div class="row" style="align-items:flex-start">
        <div style="min-width:0">
          <div class="word">${highlightIfNeeded(c.word || "")}</div>
          <div>${renderPills(pillTexts)}</div>
          ${grammarLine ? `<div class="muted" style="margin-top:6px">${escapeHtml(grammarLine)}</div>` : ""}
        </div>
        <div class="muted">${escapeHtml(t("due"))}: <span class="mono">${escapeHtml(fmtDate(dueMs))}</span></div>
      </div>

      ${renderTextBlock(t("meaning"), meaningLines, "txt")}
      ${renderTextBlock(t("nuance"), nuanceLines, "txt")}
      ${renderTextBlock(t("minimal"), minimalLines, "txt")}
      ${renderTextBlock(t("etymology"), etyLines, "txt")}
      ${renderTextBlock(t("example"), exampleLines, "txt mono")}
      ${renderTextBlock(t("task"), taskLines, "txt")}

      ${mode === "review" ? `
        <div class="label">${escapeHtml(t("score"))}</div>
        <div class="score">
          <button class="btn" data-score="bad">${escapeHtml(t("bad"))}</button>
          <button class="btn" data-score="ok">${escapeHtml(t("ok"))}</button>
          <button class="btn" data-score="good">${escapeHtml(t("good"))}</button>
        </div>
        <div class="muted" style="margin-top:8px" data-status=""></div>
      ` : `
        <div class="muted" style="margin-top:10px">${escapeHtml(t("score"))}: ${escapeHtml(t("bad"))} / ${escapeHtml(t("ok"))} / ${escapeHtml(t("good"))} はReviewで</div>
      `}
    `;

    if (mode === "review") {
      const statusEl = el.querySelector('[data-status]');
      el.querySelectorAll("button[data-score]").forEach(btn => {
        btn.addEventListener("click", () => {
          const score = btn.getAttribute("data-score");
          applyScore(c.id, score);
          statusEl.textContent = t("done") + ` → ${t("due")}: ${fmtDate(getCardDueMs(c.id))}`;
          setTimeout(() => { el.remove(); updateCountAfterRemove(); }, 250);
        });
      });
    }

    return el;
  }

  function updateCountAfterRemove() {
    const list = document.getElementById("list");
    const left = list.querySelectorAll(".card").length;
    document.getElementById("screenCount").textContent = left ? `${left}` : "";
    if (!left && getView() === "review") {
      document.getElementById("list").innerHTML = `<div class="muted">OK。いま復習はありません。</div>`;
    }
  }

function render() {
  const lang = getLang();
  document.documentElement.lang = (lang === "ja" ? "ja" : "de");

  // Header texts
  document.getElementById("appTitle").textContent = UI[lang].title;
  document.getElementById("appSub").textContent = UI[lang].sub;
  document.getElementById("langBtn").textContent = (lang === "ja" ? "JP" : "DE");
  document.getElementById("shuffleBtn").textContent = "↻ " + UI[lang].shuffle;

  // Tabs
  const view = getView();
  const tabToday = document.getElementById("tabToday");
  const tabReview = document.getElementById("tabReview");
  tabToday.textContent = UI[lang].tabToday;
  tabReview.textContent = UI[lang].tabReview;
  tabToday.classList.toggle("primary", view === "today");
  tabReview.classList.toggle("primary", view === "review");

  const list = document.getElementById("list");
  list.innerHTML = "";

if (view === "today") {
  document.getElementById("screenTitle").textContent =
    QUERY ? UI[lang].searchResult : UI[lang].today;

  const seed = getSeed();
  const base = filterCardsByQuery(CARDS);

  if (!base.length) {
    // Todayカードはあるが、検索にヒットしない
    list.innerHTML = `<div class="muted">該当なし。検索語を変えてみてください。</div>`;
    document.getElementById("screenCount").textContent = "";
  } else {
    const today = seedShuffle(base, seed).slice(0, 5);
    for (const c of today) list.appendChild(renderCard(c, "today"));
    document.getElementById("screenCount").textContent = `${today.length}`;
  }

} else {
  document.getElementById("screenTitle").textContent =
    QUERY ? UI[lang].searchResult : UI[lang].review;

  const due = getDueCards();
  const dueFiltered = filterCardsByQuery(due);

  if (!due.length) {
    // 復習カード自体がない
    list.innerHTML = `<div class="muted">OK。いま復習はありません。</div>`;
    document.getElementById("screenCount").textContent = "";
  } else if (!dueFiltered.length) {
    // 復習カードはあるが、検索にヒットしない
    list.innerHTML = `<div class="muted">該当なし。検索語を変えてみてください。</div>`;
    document.getElementById("screenCount").textContent = "";
  } else {
    for (const c of dueFiltered) list.appendChild(renderCard(c, "review"));
    document.getElementById("screenCount").textContent = `${dueFiltered.length}`;
  }
}
}
  // =========================
  // Events
  // =========================
  document.getElementById("langBtn").addEventListener("click", () => {
    setLang(getLang() === "ja" ? "de" : "ja");
    render();
  });

  document.getElementById("shuffleBtn").addEventListener("click", () => {
    rotateSeed();
    render();
  });

  document.getElementById("tabToday").addEventListener("click", () => {
    setView("today");
    render();
  });

  document.getElementById("tabReview").addEventListener("click", () => {
    setView("review");
    render();
  });
  // Search input
const qEl = document.getElementById("q");
const clearEl = document.getElementById("clearBtn");

qEl.addEventListener("input", () => {
  setQuery(qEl.value || "");
  render();
});

clearEl.addEventListener("click", () => {
  qEl.value = "";
  setQuery("");
  render();
  qEl.focus();
});

  // =========================
  // PWA: service worker
  // =========================
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", async () => {
      try { await navigator.serviceWorker.register("./sw.js"); } catch (e) {}
    });
  }

  // =========================
  // Boot
  // =========================
  (async () => {
    await loadCards();
    render();
  })();
</script>
</body>
</html>

<!doctype html>
<html lang="ja" data-theme="dark">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#0b0b0b"
    id="themeColorMeta"
  >

  <link
    rel="manifest"
    href="./manifest.webmanifest"
  >

  <link
    rel="stylesheet"
    href="./style.css"
  >

  <title>Deutsch Trainer</title>
</head>

<body>

  <!-- =========================================================
       Header
  ========================================================== -->
  <header class="app-header">

    <div class="header-top">

      <div class="header-title-block">

        <h1 class="app-title">
          Deutsch Trainer
        </h1>

        <div
          id="wordCount"
          class="word-count"
        >
          Wörter werden geladen...
        </div>

      </div>


      <div class="header-actions">

        <!-- UI language -->
        <button
          id="languageToggle"
          class="icon-button"
          type="button"
          aria-label="Sprache wechseln"
          title="Sprache wechseln"
        >
          DE
        </button>


        <!-- Theme -->
        <button
          id="themeToggle"
          class="icon-button theme-toggle"
          type="button"
          aria-label="Theme wechseln"
          title="Theme wechseln"
        >
          ☀︎
        </button>

      </div>

    </div>

  </header>


  <!-- =========================================================
       Main
  ========================================================== -->
  <main class="app-main">


    <!-- =======================================================
         Dictionary View
    ======================================================== -->
    <section
      id="dictionaryView"
      class="view"
    >


      <!-- =====================================================
           Today's 5 Words
      ====================================================== -->
      <section class="panel today-panel">

        <div class="section-heading-row">

          <div class="section-heading-accent">

            <div
              class="section-accent-bar section-accent-gold"
              aria-hidden="true"
            ></div>

            <div>

              <h2
                id="todayTitle"
                class="section-title"
              >
                今日の5語
              </h2>

              <p
                id="todaySubtitle"
                class="section-subtitle"
              >
                Heute – 5 Wörter
              </p>

            </div>

          </div>


          <button
            id="refreshTodayButton"
            class="small-button"
            type="button"
            aria-label="今日の5語を更新"
            title="今日の5語を更新"
          >
            ↻
          </button>

        </div>


        <div
          id="todayWordList"
          class="headline-list"
          aria-live="polite"
        >
          <div
            id="todayLoadingMessage"
            class="loading-message"
          >
            読み込み中...
          </div>
        </div>

      </section>


      <!-- =====================================================
           Search
      ====================================================== -->
      <section class="panel search-panel">

        <label
          id="searchLabel"
          for="searchInput"
          class="field-label"
        >
          検索
        </label>


        <div class="search-box">

          <input
            id="searchInput"
            class="search-input"
            type="search"
            placeholder="単語・意味・例文などを検索"
            autocomplete="off"
            spellcheck="false"
          >


          <button
            id="clearSearchButton"
            class="clear-search-button"
            type="button"
            aria-label="検索をクリア"
            title="検索をクリア"
          >
            ×
          </button>

        </div>

      </section>


      <!-- =====================================================
           Dictionary / Filters
      ====================================================== -->
      <section class="panel filter-panel">

        <div class="section-heading-row">

          <div class="section-heading-accent">

            <div
              class="section-accent-bar section-accent-red"
              aria-hidden="true"
            ></div>

            <div>

              <h2
                id="dictionaryTitle"
                class="section-title"
              >
                Wörterbuch
              </h2>

              <p
                id="dictionarySubtitle"
                class="section-subtitle"
              >
                辞書・絞り込み
              </p>

            </div>

          </div>


          <button
            id="resetFiltersButton"
            class="small-button"
            type="button"
          >
            リセット
          </button>

        </div>


        <div class="filter-grid">


          <!-- Level -->
          <div class="filter-field">

            <label
              id="levelLabel"
              for="levelFilter"
              class="field-label"
            >
              Level
            </label>

            <select
              id="levelFilter"
              class="filter-select"
            >
              <option
                id="levelAllOption"
                value=""
              >
                すべて
              </option>

              <option value="A1">
                A1
              </option>

              <option value="A2">
                A2
              </option>

              <option value="B1">
                B1
              </option>

              <option value="B2">
                B2
              </option>

              <option value="C1">
                C1
              </option>

              <option value="C2">
                C2
              </option>
            </select>

          </div>


          <!-- Wortart -->
          <div class="filter-field">

            <label
              id="posLabel"
              for="posFilter"
              class="field-label"
            >
              Wortart
            </label>

            <select
              id="posFilter"
              class="filter-select"
            >

              <option
                id="posAllOption"
                value=""
              >
                すべて
              </option>

              <option value="noun">
                Nomen
              </option>

              <option value="verb">
                Verb
              </option>

              <option value="adj">
                Adjektiv
              </option>

              <option value="adv">
                Adverb
              </option>

              <option value="prep">
                Präposition
              </option>

              <option value="conj">
                Konjunktion
              </option>

              <option value="pron">
                Pronomen
              </option>

              <option value="particle">
                Partikel
              </option>

              <option value="interj">
                Interjektion
              </option>

              <option value="phrase">
                Phrase
              </option>

              <option value="idiom">
                Redewendung
              </option>

            </select>

          </div>


          <!-- Häufigkeit -->
          <div class="filter-field">

            <label
              id="freqLabel"
              for="freqFilter"
              class="field-label"
            >
              Häufigkeit
            </label>

            <select
              id="freqFilter"
              class="filter-select"
            >

              <option
                id="freqAllOption"
                value=""
              >
                すべて
              </option>

              <option value="very often">
                very often
              </option>

              <option value="often">
                often
              </option>

              <option value="sometimes">
                sometimes
              </option>

              <option value="rare">
                rare
              </option>

              <option value="very rare">
                very rare
              </option>

            </select>

          </div>


          <!-- Learning Status -->
          <div class="filter-field">

            <label
              id="statusLabel"
              for="statusFilter"
              class="field-label"
            >
              習得状態
            </label>

            <select
              id="statusFilter"
              class="filter-select"
            >

              <option
                id="statusAllOption"
                value=""
              >
                すべて
              </option>

              <option
                id="statusKnownOption"
                value="known"
              >
                覚えた
              </option>

              <option
                id="statusLearningOption"
                value="learning"
              >
                まだ覚えていない
              </option>

              <option
                id="statusUnsetOption"
                value="unset"
              >
                未設定
              </option>

            </select>

          </div>


          <!-- Bookmark -->
          <div class="filter-field">

            <label
              id="bookmarkLabel"
              for="bookmarkFilter"
              class="field-label"
            >
              Bookmark
            </label>

            <select
              id="bookmarkFilter"
              class="filter-select"
            >

              <option
                id="bookmarkAllOption"
                value=""
              >
                すべて
              </option>

              <option
                id="bookmarkOnlyOption"
                value="bookmarked"
              >
                ブックマークのみ
              </option>

            </select>

          </div>


          <!-- Tag -->
          <div class="filter-field">

            <label
              id="tagLabel"
              for="tagFilter"
              class="field-label"
            >
              Tag
            </label>

            <select
              id="tagFilter"
              class="filter-select"
            >
              <option
                id="tagAllOption"
                value=""
              >
                すべて
              </option>
            </select>

          </div>


          <!-- Sort -->
          <div class="filter-field filter-field-wide">

            <label
              id="sortLabel"
              for="sortSelect"
              class="field-label"
            >
              Sortierung
            </label>

            <select
              id="sortSelect"
              class="filter-select"
            >

              <option
                id="sortAlphabeticalOption"
                value="alphabetical"
              >
                A → Z
              </option>

              <option
                id="sortReverseOption"
                value="reverse"
              >
                Z → A
              </option>

              <option
                id="sortNewOption"
                value="sid-new"
              >
                新しいカード順
              </option>

              <option
                id="sortOldOption"
                value="sid-old"
              >
                古いカード順
              </option>

              <option
                id="sortLevelOption"
                value="level"
              >
                レベル順
              </option>

            </select>

          </div>

        </div>


        <div
          id="activeFilterSummary"
          class="active-filter-summary"
        ></div>

      </section>


      <!-- =====================================================
           Dictionary Headline List
      ====================================================== -->
      <section class="panel dictionary-panel">

        <div class="dictionary-list-header">

          <div
            id="filteredWordCount"
            class="filtered-word-count"
          >
            0 Wörter
          </div>

        </div>


        <div
          id="dictionaryWordList"
          class="headline-list dictionary-word-list"
          aria-live="polite"
        >

          <div
            id="dictionaryLoadingMessage"
            class="loading-message"
          >
            辞書を読み込み中...
          </div>

        </div>

      </section>

    </section>



    <!-- =======================================================
         Detail View
    ======================================================== -->
    <section
      id="detailView"
      class="view hidden"
      aria-hidden="true"
    >


      <!-- Back -->
      <div class="detail-toolbar">

        <button
          id="backToDictionaryButton"
          class="back-button"
          type="button"
        >
          ← Wörterbuch
        </button>

      </div>


      <!-- =====================================================
           Main Detail Card
      ====================================================== -->
      <article
        id="detailCard"
        class="detail-card"
      >


        <!-- ===================================================
             Word Header
        ==================================================== -->
        <section class="detail-word-header">

          <div class="detail-top-accent">

            <span
              class="flag-line flag-line-black"
              aria-hidden="true"
            ></span>

            <span
              class="flag-line flag-line-red"
              aria-hidden="true"
            ></span>

            <span
              class="flag-line flag-line-gold"
              aria-hidden="true"
            ></span>

          </div>


          <div class="detail-heading-row">

            <div class="detail-heading-main">

              <h2
                id="detailWord"
                class="detail-word"
              ></h2>


              <!-- IPA -->
              <div
                id="detailPronunciation"
                class="detail-pronunciation hidden"
              ></div>


              <!-- POS / gender / level / frequency / sid -->
              <div
                id="detailMeta"
                class="detail-meta"
              ></div>

            </div>


            <!-- Bookmark -->
            <button
              id="bookmarkButton"
              class="bookmark-button"
              type="button"
              aria-label="ブックマーク"
              title="ブックマーク"
            >
              ☆
            </button>

          </div>


          <!-- Tags -->
          <div
            id="detailTags"
            class="tag-list"
          ></div>


          <!-- Learning Status -->
          <div class="learning-status-block">

            <div
              id="learningStatusLabel"
              class="learning-status-label"
            >
              習得状態
            </div>


            <div class="learning-status-buttons">

              <button
                id="statusUnsetButton"
                class="status-button"
                type="button"
                data-status="unset"
              >
                ○ 未設定
              </button>


              <button
                id="statusKnownButton"
                class="status-button"
                type="button"
                data-status="known"
              >
                ✓ 覚えた
              </button>


              <button
                id="statusLearningButton"
                class="status-button"
                type="button"
                data-status="learning"
              >
                ● まだ覚えていない
              </button>

            </div>

          </div>

        </section>



        <!-- ===================================================
             Meaning
        ==================================================== -->
        <section
          id="meaningSection"
          class="detail-section"
        >

          <h3
            id="meaningTitle"
            class="detail-section-title"
          >
            意味
          </h3>

          <div
            id="detailMeaning"
            class="detail-section-content"
          ></div>

        </section>



        <!-- ===================================================
             Nuance
        ==================================================== -->
        <section
          id="nuanceSection"
          class="detail-section"
        >

          <h3
            id="nuanceTitle"
            class="detail-section-title"
          >
            ニュアンス
          </h3>

          <div
            id="detailNuance"
            class="detail-section-content"
          ></div>

        </section>



        <!-- ===================================================
             Conjugation
             Optional
        ==================================================== -->
        <section
          id="conjugationSection"
          class="detail-section hidden"
        >

          <h3
            id="conjugationTitle"
            class="detail-section-title"
          >
            活用
          </h3>

          <div
            id="detailConjugation"
            class="detail-section-content"
          ></div>

        </section>



        <!-- ===================================================
             Collocations
             Optional
        ==================================================== -->
        <section
          id="collocationsSection"
          class="detail-section hidden"
        >

          <h3
            id="collocationsTitle"
            class="detail-section-title"
          >
            コロケーション
          </h3>

          <div
            id="detailCollocations"
            class="detail-section-content"
          ></div>

        </section>



        <!-- ===================================================
             Minimal Contrast
        ==================================================== -->
        <section
          id="minimalSection"
          class="detail-section"
        >

          <h3
            id="minimalTitle"
            class="detail-section-title"
          >
            Minimal
          </h3>

          <div
            id="detailMinimal"
            class="detail-section-content"
          ></div>

        </section>



        <!-- ===================================================
             Equivalents
        ==================================================== -->
        <section
          id="equivalentsSection"
          class="detail-section hidden"
        >

          <h3
            id="equivalentsTitle"
            class="detail-section-title"
          >
            他言語相当語
          </h3>

          <div
            id="detailEquivalents"
            class="detail-section-content"
          ></div>

        </section>



        <!-- ===================================================
             Etymology
        ==================================================== -->
        <section
          id="etymologySection"
          class="detail-section"
        >

          <h3
            id="etymologyTitle"
            class="detail-section-title"
          >
            語源
          </h3>

          <div
            id="detailEtymology"
            class="detail-section-content"
          ></div>

        </section>



        <!-- ===================================================
             Example
        ==================================================== -->
        <section
          id="exampleSection"
          class="detail-section"
        >

          <h3
            id="exampleTitle"
            class="detail-section-title"
          >
            例文
          </h3>

          <div
            id="detailExample"
            class="detail-section-content"
          ></div>

        </section>



        <!-- ===================================================
             Task
        ==================================================== -->
        <section
          id="taskSection"
          class="detail-section"
        >

          <h3
            id="taskTitle"
            class="detail-section-title"
          >
            Task
          </h3>

          <div
            id="detailTask"
            class="detail-section-content"
          ></div>

        </section>

      </article>

    </section>

  </main>


  <!-- =========================================================
       Toast
  ========================================================== -->
  <div
    id="toast"
    class="toast hidden"
    role="status"
    aria-live="polite"
  ></div>


  <!-- =========================================================
       JavaScript
  ========================================================== -->
  <script src="./app.js"></script>

</body>
</html>
